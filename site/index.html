<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>晶源档案 · 卡组与运营知识库</title>
  <style>:root { --ink:#20302f; --muted:#71817e; --accent:#217663; --accent-soft:#e8f2ee; --line:#dfe7e2; --paper:#f5f7f4; --white:#fff; --sidebar:#172927; --danger:#a24b43; --danger-soft:#f9ebe7; --warning:#8c6c35; --warning-soft:#f4efe2; font-synthesis:none; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.75 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--paper); }
button,input,textarea,select { font:inherit; }
button { cursor:pointer; border:1px solid var(--line); background:var(--white); color:var(--ink); border-radius:7px; padding:7px 12px; line-height:1.5; transition:background .12s,border-color .12s; }
button:hover { border-color:#a1b7ac; background:#f0f5f1; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary:hover { background:#195e4e; }
a { color:var(--accent); text-decoration:none; overflow-wrap:anywhere; }
a:hover { text-decoration:underline; }
h1,h2,h3,p { margin:0; }
h1 { font-size:28px; line-height:1.4; letter-spacing:-.025em; font-weight:650; }
h2 { font-size:18px; font-weight:650; line-height:1.5; }
h3 { font-size:15px; font-weight:600; line-height:1.5; }
input,textarea,select { color:var(--ink); background:var(--white); border:1px solid #d4dfd8; border-radius:6px; padding:8px 10px; max-width:100%; }
textarea { resize:vertical; }
small,.muted { color:var(--muted); }
.app-shell { min-height:100vh; }
.release-panel { margin-bottom:22px; border:1px solid var(--line); border-radius:9px; background:var(--white); font-size:12px; }
.release-panel summary { cursor:pointer; padding:12px 16px; color:var(--muted); }
.release-panel summary strong { color:var(--accent); margin-right:14px; }
.release-panel summary span { display:inline-block; margin-right:14px; }
.release-content { padding:0 16px 16px; }
.release-content p { margin-top:12px; overflow-wrap:anywhere; }
.release-content .button-row { margin-top:14px; flex-wrap:wrap; }
.release-content button:disabled { cursor:not-allowed; opacity:.5; }
.sidebar { position:fixed; inset:0 auto 0 0; width:260px; background:var(--sidebar); color:#e2ece5; display:flex; flex-direction:column; z-index:30; overflow-y:auto; }
.brand { color:inherit; border:0; border-radius:0; text-align:left; background:none; display:flex; gap:12px; align-items:center; padding:29px 24px 15px; width:100%; }
.brand:hover { background:none; }
.brand-mark { width:36px; height:42px; font-size:40px; line-height:1; color:#b8decb; }
.brand strong { display:block; font-size:20px; letter-spacing:.12em; font-weight:600; }
.brand small { display:block; color:#7eaa98; font-size:9px; letter-spacing:.12em; margin-top:2px; }
.scope-label { padding:0 25px 23px; color:#94afa2; font-size:11px; }
.primary-nav { padding:0 15px 21px; border-bottom:1px solid #2a3e37; }
.primary-nav button,.sidebar-bottom button { display:flex; justify-content:space-between; align-items:center; color:#b6c9bd; width:100%; padding:10px 12px; background:transparent; border:0; text-align:left; }
.primary-nav button small,.sidebar-bottom small { color:#809e8c; font-size:11px; }
.primary-nav button.active,.primary-nav button:hover { background:#2a4137; color:#e9f4ec; }
.tree-heading { padding:23px 25px 10px; color:#e0ece4; font-size:12px; display:flex; justify-content:space-between; }
.tree-heading span { font-size:9px; color:#819b8b; align-self:center; }
.tree { padding:0 12px 25px; }
.faction-tree { margin-top:9px; }
.tree-row { display:flex; align-items:center; }
.tree button { color:#b0c6b9; background:transparent; border:0; border-radius:4px; text-align:left; }
.tree button:hover { color:#f1f7f3; background:#253c31; }
.tree button.current { color:#def6e6; }
.tree .expander { width:24px; flex-shrink:0; padding:3px; text-align:center; font-size:18px; color:#7f9e8c; }
.faction-label,.group-label { display:flex; justify-content:space-between; align-items:center; flex:1; padding:8px 9px !important; }
.faction-label { font-weight:600; }
.tree small { color:#7e9a88; font-size:10px; }
.faction-children { margin-left:16px; padding-left:7px; border-left:1px solid #324d3d; }
.tree-section-label { margin:12px 12px 5px; padding-top:8px; border-top:1px solid #324d3d; color:#a9c5b5; font-size:11px; letter-spacing:.08em; }
.group-label { font-size:12px; }
.entry-children { padding:0 0 5px 23px; }
.tree .tree-leaf { display:flex; gap:7px; align-items:center; width:100%; padding:7px 7px; font-size:11px; line-height:1.6; }
.tree-leaf span:last-child { overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; white-space:normal; overflow-wrap:anywhere; }
.tree .tree-leaf.selected { background:#31533f; color:#eef8f1; }
.leaf-dot { flex-shrink:0; width:4px; height:4px; border-radius:50%; background:#6c9e80; }
.leaf-dot.old { background:#d49779; }
.sidebar-bottom { margin-top:auto; padding:12px 17px 22px; border-top:1px solid #2a3e37; }
.sidebar-bottom p { color:#779080; font-size:11px; padding:13px 12px 0; line-height:1.8; }
.workspace { margin-left:260px; }
.topbar { height:78px; display:flex; align-items:center; gap:18px; padding:0 36px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
.search-box { display:flex; align-items:center; gap:10px; flex:1; max-width:610px; min-width:170px; }
.search-box>span { font-size:24px; color:var(--muted); }
.search-box input { border:0; background:transparent; flex:1; width:100%; padding:10px 0; }
.search-box input::placeholder { color:#8a9891; }
kbd { font:10px system-ui; border:1px solid var(--line); padding:3px 5px; border-radius:4px; white-space:nowrap; color:#91a296; }
.top-actions { margin-left:auto; display:flex; gap:9px; white-space:nowrap; }
.mobile-menu { display:none; }
.main-content { max-width:1430px; margin:0 auto; padding:36px 38px 20px; }
.eyebrow { color:var(--accent); letter-spacing:.14em; font-size:10px; font-weight:600; margin-bottom:9px; }
.overview { display:grid; grid-template-columns:minmax(260px,1fr) minmax(260px,.7fr); gap:32px; padding:7px 0 29px; }
.overview h1 { font-size:30px; }
.overview-copy>p { color:var(--muted); font-size:14px; margin-top:12px; line-height:1.9; }
.overview-stats { display:flex; gap:31px; margin-top:24px; }
.overview-stats>div { display:flex; align-items:baseline; gap:8px; }
.overview-stats strong { font-size:25px; line-height:1.3; font-weight:650; }
.overview-stats span { font-size:11px; color:var(--muted); }
.start-here { border-left:1px solid var(--line); padding-left:26px; display:flex; flex-direction:column; gap:12px; }
.start-here>small { font-size:11px; }
.start-here button { text-align:left; border:0; border-radius:0; padding:0 0 12px; background:transparent; border-bottom:1px solid var(--line); }
.start-here button:last-child { border-bottom:0; padding-bottom:0; }
.start-here button>span { display:block; font-size:11px; color:var(--muted); }
.start-here strong { display:block; font-size:15px; font-weight:550; margin:2px 0 6px; }
.start-here button>span:last-child { color:var(--accent); }
.quick-warning { display:flex; gap:12px; align-items:center; padding:13px 17px; background:#f3ece4; border-radius:8px; color:#775f47; margin-bottom:32px; font-size:12px; }
.quick-warning button { border:0; background:transparent; padding:0; margin-left:auto; color:#8c5e40; white-space:nowrap; font-size:12px; }
.badge { display:inline-block; padding:3px 8px; border-radius:4px; font-size:10px; font-weight:500; line-height:1.5; white-space:nowrap; }
.badge.warning { background:var(--warning-soft); color:var(--warning); }
.badge.danger { background:var(--danger-soft); color:var(--danger); }
.badge.fresh { background:var(--accent-soft); color:var(--accent); }
.badge.muted { background:#eef0ef; color:#7a817c; }
.catalog-header { display:flex; gap:15px; justify-content:space-between; align-items:end; margin-bottom:20px; }
.catalog h2>span { margin-left:10px; font-size:12px; font-weight:400; color:var(--muted); }
.filters { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
.filters select { font-size:11px; padding:7px 8px; background:transparent; max-width:160px; }
.entry-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:17px; }
.entry-card { display:flex; flex-direction:column; align-items:stretch; border:1px solid var(--line); border-radius:9px; background:var(--white); padding:17px 19px 14px; min-width:0; }
.entry-card:hover { border-color:#b0c9ba; }
.entry-card.historical { background:#fdfbf9; }
.card-kicker { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:6px; }
.card-kicker>span { font-size:10px; color:var(--muted); letter-spacing:.02em; }
.favorite { border:0; background:transparent; padding:0; font-size:25px; color:#b1beb4; flex-shrink:0; }
.favorite.small { font-size:19px; line-height:1; }
.favorite:hover { background:transparent; color:var(--accent); }
.favorite.active { color:var(--accent); }
.card-title { text-align:left; font-size:16px; font-weight:600; line-height:1.6; padding:0; border:0; background:transparent; margin-bottom:8px; }
.card-title:hover { background:transparent; color:var(--accent); }
.card-title,.detail-title h1 { overflow-wrap:anywhere; }
.entry-card>p { font-size:12px; color:var(--muted); line-height:1.9; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:68px; margin-bottom:15px; }
.compact-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; margin-bottom:18px; }
.compact-tags span { font-size:10px; background:#f3f6f2; color:#687d6d; padding:3px 6px; border-radius:3px; }
.card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid #edf1ed; padding-top:11px; }
.card-footer>span:last-child { font-size:10px; color:#91a096; }
.page-footer { display:flex; gap:20px; justify-content:space-between; font-size:10px; color:#8e9d93; border-top:1px solid var(--line); margin-top:35px; padding:18px 0 5px; }
.empty-state { padding:50px 20px; text-align:center; border:1px dashed var(--line); border-radius:8px; }
.empty-state p { color:var(--muted); margin:8px 0 18px; }
.search-context { display:flex; gap:10px; align-items:center; margin-bottom:18px; font-size:12px; color:var(--muted); }
.search-context button { padding:3px 8px; font-size:11px; }
.detail { max-width:1000px; margin:0 auto; }
.back-link { padding:0; border:0; background:transparent; font-size:12px; color:var(--muted); margin-bottom:23px; }
.back-link:hover { background:transparent; color:var(--accent); }
.breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:10px; font-size:11px; color:var(--muted); margin-bottom:17px; }
.breadcrumb>span { color:#b4c2b9; }
.detail-title { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; }
.title-badges { display:flex; gap:10px; align-items:center; margin-bottom:11px; }
.subtle-label { color:var(--muted); font-size:11px; }
.lead { color:var(--muted); font-size:14px; line-height:1.9; margin-top:12px; }
.version-banner { padding:15px 18px; background:#edf1e8; border-radius:7px; font-size:12px; color:#5d714e; margin:23px 0; }
.version-banner strong { font-size:12px; display:block; margin-bottom:4px; }
.version-banner.danger { background:var(--danger-soft); color:var(--danger); }
.entry-toolbar { display:flex; justify-content:space-between; gap:15px; align-items:center; margin:20px 0 25px; flex-wrap:wrap; }
.entry-toolbar>label { display:flex; gap:9px; align-items:center; font-size:11px; color:var(--muted); }
.entry-toolbar select { font-size:11px; padding:6px 10px; }
.button-row { display:flex; gap:8px; flex-wrap:wrap; }
.entry-toolbar button { font-size:11px; }
.danger-text { color:var(--danger); }
.tabs { display:flex; gap:22px; border-bottom:1px solid var(--line); overflow-x:auto; }
.tabs button { border:0; border-radius:0; padding:12px 0; background:transparent; color:var(--muted); font-size:12px; white-space:nowrap; border-bottom:2px solid transparent; }
.tabs button.selected { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
.tab-content { padding-top:23px; }
.evidence-note { color:var(--muted); font-size:11px; line-height:1.8; margin-bottom:24px; padding-left:12px; border-left:2px solid #bfd5c6; }
.detail-section { margin-bottom:28px; }
.section-heading { display:flex; align-items:baseline; flex-wrap:wrap; gap:12px; margin-bottom:13px; }
.section-heading h2 { font-size:16px; }
.section-heading>span { color:var(--muted); font-size:10px; }
.card-tags { display:flex; gap:8px; flex-wrap:wrap; }
.card-tags>span { padding:7px 12px; border:1px solid var(--line); border-radius:5px; font-size:12px; background:var(--white); }
.card-tags .core-card { background:var(--accent-soft); color:var(--accent); border-color:#d5e6dc; }
.all-cards { margin-top:15px; gap:7px; }
.all-cards>span { font-size:11px; padding:5px 9px; }
.context-grid { display:flex; flex-wrap:wrap; gap:35px; margin-bottom:26px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.context-grid small { font-size:10px; }
.context-grid p { font-size:12px; margin-top:4px; }
.timeline { display:flex; flex-direction:column; }
.timeline-step { display:flex; gap:18px; padding:0 0 23px; position:relative; }
.timeline-step:last-child { padding-bottom:0; }
.timeline-step:not(:last-child):before { content:""; position:absolute; left:17px; top:35px; bottom:0; border-left:1px solid #d2dfd6; }
.step-index { flex-shrink:0; display:flex; align-items:center; justify-content:center; width:35px; height:35px; background:#e8efe8; color:var(--accent); border-radius:50%; font-size:10px; font-weight:600; }
.timeline h3 { font-size:13px; margin:3px 0 5px; }
.timeline p { color:var(--muted); font-size:13px; }
.strategy-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; border-top:1px solid var(--line); padding-top:24px; }
.strategy-grid p { color:var(--muted); font-size:13px; }
.priority-list { margin:0; padding-left:21px; color:var(--muted); font-size:13px; }
.priority-list li { padding:3px 0; }
.priority-list li::marker { color:var(--accent); }
.pitfall-list { margin:0; padding:14px 18px 14px 34px; background:var(--warning-soft); border-radius:7px; color:#7b6949; font-size:12px; }
.pitfall-list li { padding:3px 0; }
.next-action { display:flex; justify-content:space-between; align-items:center; gap:15px; padding:17px 19px; background:var(--accent-soft); border-radius:7px; color:var(--accent); font-size:12px; }
.next-action button { font-size:12px; }
.code-field { width:100%; margin:12px 0; font:12px/1.7 monospace; word-break:break-all; min-height:90px; }
.notes-field { width:100%; min-height:290px; line-height:1.9; margin-top:14px; }
.note-footer { display:flex; justify-content:space-between; gap:15px; font-size:10px; color:var(--muted); margin-top:8px; }
.sources-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:15px; }
.source-list { display:flex; flex-direction:column; gap:14px; }
.source-card { padding:19px; border:1px solid var(--line); background:var(--white); border-radius:8px; }
.source-meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:10px; margin-bottom:9px; }
.source-card h3 { margin-bottom:9px; font-size:14px; }
.source-card p { font-size:12px; line-height:1.8; margin-top:6px; }
.source-card small { display:block; margin-top:8px; font-size:10px; }
.source-related { margin-top:13px; padding:5px 8px; font-size:11px; }
.page-section-title { margin:30px 0 16px; }
.storage-alert { border:1px solid #e3b2a3; background:var(--danger-soft); color:var(--danger); padding:15px; border-radius:7px; margin-bottom:20px; font-size:12px; }
.modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(13,28,23,.5); display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { background:var(--paper); width:min(560px,100%); max-height:90vh; overflow:auto; border-radius:12px; border:1px solid var(--line); }
.modal.wide { width:min(880px,100%); }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:19px 25px; border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:1; }
.modal-header h2 { font-size:17px; }
.modal-header button { border:0; background:none; font-size:22px; padding:0 7px; }
.edit-form,.backup-content,.confirm-content { padding:23px 25px; }
.edit-form label { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); margin-bottom:17px; }
.edit-form input,.edit-form textarea,.edit-form select { width:100%; color:var(--ink); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
.editor-details { border-top:1px solid var(--line); padding:15px 0 0; margin:5px 0 18px; }
.editor-details summary { cursor:pointer; font-size:13px; font-weight:600; margin-bottom:15px; }
.modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:20px; }
.form-error { padding:12px; background:var(--danger-soft); color:var(--danger); border-radius:6px; font-size:12px; margin-bottom:15px; }
.form-error .button-row { margin-top:10px; }
.backup-content>p { color:var(--muted); font-size:12px; margin-bottom:20px; }
.backup-option { display:flex; flex-direction:column; gap:5px; text-align:left; width:100%; margin-top:11px; padding:15px; }
.backup-option strong { font-size:13px; }
.backup-option span { color:var(--muted); font-size:11px; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:200; padding:12px 20px; background:#203c30; border:1px solid #456f52; color:#eff7f1; border-radius:7px; font-size:12px; max-width:min(700px,90vw); }
@media(min-width:1650px) { .entry-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
.seed-update { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:18px 20px; margin-bottom:24px; border:1px solid var(--line); background:var(--paper); border-radius:8px; }
.seed-update p { margin:7px 0 0; font-size:12px; color:var(--muted); }
.seed-update button { flex-shrink:0; }
.mechanics-entry-banner { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 24px; border:1px solid var(--line); background:var(--accent-soft); border-radius:9px; margin-bottom:30px; }
.mechanics-entry-banner h2 { margin:6px 0; }
.mechanics-entry-banner p { color:var(--muted); font-size:12px; }
.mechanics-entry-banner button { flex-shrink:0; }
.mechanics-hero { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:40px; margin-bottom:30px; }
.mechanics-hero h1 { margin:14px 0 17px; font-size:30px; line-height:1.6; }
.mechanics-hero p { color:var(--muted); max-width:600px; margin-bottom:22px; }
.mechanics-primary-link { display:inline-flex; align-items:center; padding:9px 16px; border-radius:6px; background:var(--accent); color:var(--white); font-weight:600; }
.mechanics-progress { display:flex; flex-direction:column; justify-content:center; border-left:1px solid var(--line); padding-left:28px; gap:10px; font-size:12px; color:var(--muted); }
.mechanics-progress>strong { font-size:38px; line-height:1.2; color:var(--ink); font-weight:600; }
.mechanics-progress strong small { font-size:19px; font-weight:400; }
.mechanics-progress progress { width:100%; height:7px; accent-color:var(--accent); }
.mechanics-scope { padding:16px 20px; border-left:3px solid var(--accent); background:var(--accent-soft); margin-bottom:30px; }
.mechanics-scope strong { font-size:13px; }
.mechanics-scope p { margin:5px 0; font-size:12px; }
.mechanics-scope>span { font-size:11px; color:var(--muted); }
.mechanics-path { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:38px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.mechanics-path button { display:flex; flex-direction:column; align-items:flex-start; padding:18px 15px; border:0; border-radius:0; background:transparent; text-align:left; }
.mechanics-path button:not(:last-child) { border-right:1px solid var(--line); }
.mechanics-path button.active,.mechanics-path button:hover { background:var(--accent-soft); }
.mechanics-path strong { font-size:15px; margin:5px 0; }
.mechanics-path span { color:var(--muted); font-size:11px; }
.mechanics-section-title { display:flex; justify-content:space-between; align-items:center; gap:15px; margin:0 0 18px; }
.mechanics-section-title>span { font-size:11px; color:var(--muted); }
.mechanics-section-title h2 small { font-size:12px; font-weight:400; margin-left:7px; }
.mechanics-module { display:grid; grid-template-columns:175px minmax(0,1fr); gap:24px; padding:25px 0; border-bottom:1px solid var(--line); }
.mechanics-module header { padding-top:15px; }
.mechanics-module header h3 { margin-bottom:8px; }
.mechanics-module header p { color:var(--muted); font-size:12px; max-width:170px; }
.mechanics-lessons { min-width:0; }
.mechanics-lesson-row { display:grid; grid-template-columns:27px minmax(0,1fr) auto; gap:12px; padding:15px 12px; border-radius:6px; color:var(--ink); }
.mechanics-lesson-row:hover { background:var(--white); text-decoration:none; }
.mechanics-lesson-row:focus-visible { outline:2px solid var(--accent); }
.mechanics-lesson-row h3 { font-size:14px; margin-bottom:4px; }
.mechanics-lesson-row p { font-size:12px; color:var(--muted); margin-bottom:5px; }
.mechanics-lesson-row small { font-size:10px; color:var(--accent); }
.mechanics-step-number { font-size:12px; font-variant-numeric:tabular-nums; color:var(--muted); padding-top:2px; }
.mechanics-state { font-size:10px; align-self:start; color:var(--muted); white-space:nowrap; padding:3px 6px; border:1px solid var(--line); border-radius:4px; }
.mechanics-state.done { background:var(--accent-soft); color:var(--accent); }
.mechanics-closing { margin:30px 0 15px; padding-top:5px; }
.mechanics-closing p { color:var(--muted); margin:9px 0 12px; font-size:13px; }
.mechanics-detail { max-width:1000px; }
.mechanics-detail h1 { font-size:27px; margin:14px 0 12px; overflow-wrap:anywhere; }
.mechanics-detail .lead { margin-bottom:18px; }
.mechanics-lesson-meta { display:flex; justify-content:space-between; align-items:center; gap:15px; color:var(--muted); font-size:12px; }
.mechanics-lesson-meta label { display:flex; align-items:center; gap:10px; }
.mechanics-boundary { padding:12px 15px; margin:17px 0; font-size:12px; background:var(--warning-soft); color:var(--warning); border-radius:5px; }
.mechanics-prerequisites { display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; margin:14px 0 20px; font-size:12px; }
.mechanics-prerequisites>span { color:var(--muted); }
.mechanics-prerequisites a { border-bottom:1px solid var(--line); }
.mechanics-panel-nav { display:flex; gap:22px; border-bottom:1px solid var(--line); margin-top:26px; }
.mechanics-panel-nav button { border:0; background:none; border-radius:0; padding:12px 0; border-bottom:2px solid transparent; font-size:13px; }
.mechanics-panel-nav button.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
.mechanics-panel { padding:26px 0; min-width:0; }
.mechanics-panel h2 { font-size:17px; }
.mechanics-panel p { line-height:1.9; margin:9px 0; }
.mechanics-concepts section { display:grid; grid-template-columns:26px minmax(0,1fr); gap:14px; padding:6px 0 22px; }
.mechanics-concepts p { font-size:14px; }
.mechanics-example { padding:19px 22px; background:var(--white); border:1px solid var(--line); border-radius:8px; margin:2px 0 24px; }
.mechanics-example p { font-size:13px; margin-bottom:0; }
.mechanics-lab { padding:22px; border:1px solid var(--line); border-radius:8px; background:var(--white); margin:24px 0; }
.mechanics-lab>p { font-size:12px; }
.mechanics-inputs { display:flex; flex-wrap:wrap; gap:16px; padding:12px 0 20px; }
.mechanics-inputs label { flex:1 1 145px; min-width:0; display:flex; flex-direction:column; gap:6px; font-size:12px; }
.mechanics-inputs input { width:100%; }
.mechanics-results { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.mechanics-results output { display:block; font-size:26px; color:var(--accent); font-variant-numeric:tabular-nums; margin-top:6px; overflow-wrap:anywhere; }
.mechanics-results small,.mechanics-results p { font-size:11px; }
.mechanics-decision { border-left:2px solid var(--accent); padding-left:20px; margin:28px 0; }
.mechanics-decision h2 { margin-top:7px; }
.mechanics-selfcheck { padding-top:21px; border-top:1px solid var(--line); }
.mechanics-selfcheck button { font-size:12px; }
.mechanics-evidence { padding:20px 0; border-bottom:1px solid var(--line); }
.mechanics-evidence>a { display:inline-block; margin-right:15px; font-size:12px; }
.mechanics-unknown { padding:20px; margin:25px 0; background:var(--warning-soft); border-radius:7px; }
.mechanics-unknown li { margin:8px 0; font-size:13px; }
.mechanics-sources article { padding:18px 0; border-bottom:1px solid var(--line); }
.mechanics-sources article p { font-size:12px; color:var(--muted); }
.mechanics-experiment { padding-left:23px; }
.mechanics-experiment li { padding:8px 0 8px 6px; }
.mechanics-note-field { display:flex; flex-direction:column; gap:8px; margin:22px 0; font-size:13px; }
.mechanics-note-field textarea { width:100%; line-height:1.8; }
.mechanics-related { border-top:1px solid var(--line); padding:25px 0 12px; }
.mechanics-related>button { display:flex; width:100%; justify-content:space-between; gap:16px; margin:10px 0; text-align:left; font-size:13px; padding:12px 14px; }
.mechanics-pagination { display:flex; justify-content:space-between; gap:22px; padding:25px 0; border-top:1px solid var(--line); font-size:12px; }
.mechanics-pagination a { flex:1; }
.mechanics-pagination a:last-child { text-align:right; }
@media(max-width:1080px) { .mechanics-hero { grid-template-columns:minmax(0,1fr) 185px; gap:24px; } .mechanics-progress { padding-left:20px; } .mechanics-module { grid-template-columns:140px minmax(0,1fr); gap:14px; } }
@media(max-width:760px) { .mechanics-hero { grid-template-columns:1fr; gap:25px; } .mechanics-progress { border-left:0; border-top:1px solid var(--line); padding:20px 0 0; } .mechanics-progress progress { max-width:320px; } .mechanics-module { grid-template-columns:1fr; gap:7px; } .mechanics-module header p { max-width:none; } .mechanics-entry-banner { align-items:flex-start; flex-direction:column; } .mechanics-hero h1 { font-size:26px; } .mechanics-section-title { align-items:flex-start; flex-wrap:wrap; } }
@media(max-width:440px) { .mechanics-path { grid-template-columns:1fr 1fr; } .mechanics-path button:nth-child(2) { border-right:0; } .mechanics-path button:nth-child(-n+2) { border-bottom:1px solid var(--line); } .mechanics-lesson-row { gap:8px; grid-template-columns:22px minmax(0,1fr); padding:14px 5px; } .mechanics-state { grid-column:2; justify-self:start; } .mechanics-lesson-meta { align-items:flex-start; flex-direction:column; } .mechanics-panel-nav { gap:15px; flex-wrap:wrap; } .mechanics-panel-nav button { font-size:12px; } .mechanics-lab,.mechanics-example { padding:15px; } .mechanics-detail h1 { font-size:24px; } .mechanics-results { grid-template-columns:1fr; } }
.video-intro { max-width:900px; margin-bottom:30px; }
.video-intro h1 { margin:12px 0 14px; font-size:27px; }
.video-intro>p { color:var(--muted); line-height:1.85; font-size:13px; }
.video-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; }
.video-heading h2 { margin:10px 0 5px; }
.video-heading p,.video-snapshot { font-size:12px; color:var(--muted); }
.video-open { border:1px solid var(--line); padding:10px 14px; border-radius:6px; flex-shrink:0; }
.video-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin:26px 0 12px; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.video-metrics>div { display:flex; flex-direction:column; gap:5px; }
.video-metrics strong { font-size:24px; font-variant-numeric:tabular-nums; }
.video-metrics span { font-size:12px; color:var(--muted); }
.video-study .detail-section>h2 { margin-bottom:14px; }
.video-limit { font-size:13px; }
.chapter-list { margin-top:16px; }
.chapter-list article { display:grid; grid-template-columns:62px 1fr; gap:16px; padding:18px 0; border-bottom:1px solid var(--line); }
.chapter-list article>a { font-size:13px; font-variant-numeric:tabular-nums; }
.chapter-list h3 { margin-bottom:8px; font-size:14px; }
.chapter-list p { font-size:13px; line-height:1.9; }
.video-code { margin-top:22px; padding:17px; border:1px solid var(--line); border-radius:8px; }
.video-code-title { display:flex; justify-content:space-between; gap:15px; align-items:center; }
.video-code-title h3 { font-size:14px; }
.video-code-title a { font-size:11px; }
.video-code textarea { width:100%; min-height:85px; margin:12px 0; overflow-wrap:anywhere; font-family:monospace; font-size:12px; }
@media(max-width:760px) { .seed-update { flex-direction:column; align-items:flex-start; } .tabs { overflow-x:auto; white-space:nowrap; } .tabs button { flex-shrink:0; } }
@media(max-width:440px) { .video-metrics { grid-template-columns:1fr 1fr; } .video-heading { flex-direction:column; align-items:flex-start; } .video-intro h1 { font-size:24px; } .chapter-list article { grid-template-columns:48px 1fr; gap:10px; } }
@media(max-width:1180px) { .sidebar { width:230px; } .workspace { margin-left:230px; } .main-content { padding:28px 26px 18px; } .topbar { padding:0 25px; } .catalog-header { align-items:flex-start; flex-direction:column; } .overview { gap:23px; } .overview-stats { gap:20px; } .overview-stats>div { flex-direction:column; gap:3px; } kbd { display:none; } }
@media(max-width:950px) { .overview { grid-template-columns:1fr; } .start-here { border-left:0; padding-left:0; display:grid; grid-template-columns:1fr 1fr; gap:17px; } .start-here>small { grid-column:1/-1; } .start-here button { border:0; } .overview-stats>div { flex-direction:row; gap:8px; } .top-actions button { font-size:11px; } .search-box input { font-size:12px; } .quick-warning { align-items:flex-start; flex-wrap:wrap; } .quick-warning button { margin-left:0; } .tabs { gap:18px; } .strategy-grid { grid-template-columns:1fr; gap:0; } }
@media(max-width:760px) { .sidebar { transform:translateX(-100%); width:260px; transition:transform .15s; } .sidebar.open { transform:none; } .workspace { margin-left:0; } .mobile-menu { display:block; border:0; background:none; padding:5px; } .sidebar-scrim { position:fixed; inset:0; background:rgba(13,28,23,.45); z-index:25; border:0; border-radius:0; } .topbar { height:auto; min-height:65px; flex-wrap:wrap; padding:12px 18px; gap:10px; } .top-actions { margin-left:auto; } .search-box { max-width:100%; flex:1; } .main-content { padding:25px 20px 15px; } h1,.overview h1 { font-size:25px; } .page-footer { flex-direction:column; gap:5px; } .entry-grid { grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); } }
@media(max-width:440px) { .topbar { padding:10px 13px; } .top-actions { width:100%; justify-content:flex-end; } .top-actions button { font-size:12px; } .main-content { padding:23px 16px 14px; } .overview-stats { gap:20px; } .overview-stats>div { flex-direction:column; } .start-here { grid-template-columns:1fr; gap:12px; } .overview { gap:18px; } .filters { justify-content:flex-start; } .filters select { max-width:150px; } .tabs { gap:15px; } .tabs button { font-size:11px; } .form-grid { grid-template-columns:1fr; } .modal-backdrop { padding:10px; } .edit-form,.backup-content,.confirm-content { padding:18px; } .modal-header { padding:16px 18px; } .next-action { align-items:flex-start; flex-direction:column; } .note-footer { flex-direction:column; gap:4px; } }
.segment-source, .collection-index { margin:24px 0; padding:22px; border:1px solid var(--line); border-radius:10px; background:#f7faf7; }
.segment-source h2, .collection-index h2 { margin:9px 0 12px; font-size:18px; }
.segment-source p, .collection-index>p { font-size:13px; line-height:1.9; }
.segment-source .button-row { flex-wrap:wrap; gap:12px; margin:15px 0; }
.segment-source a { font-size:12px; overflow-wrap:anywhere; }
.collection-decks { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:18px; }
.collection-deck { display:flex; flex-direction:column; gap:9px; padding:16px; text-align:left; background:white; min-width:0; }
.collection-deck strong { line-height:1.7; font-size:14px; }
.collection-deck small, .collection-deck span { color:var(--muted); font-size:11px; line-height:1.7; }
.collection-deck p { font-size:12px; line-height:1.85; margin:0; }
.collection-deck:hover { border-color:#568773; }
@media(max-width:440px) { .segment-source, .collection-index { padding:16px; } .collection-decks { grid-template-columns:1fr; } }
